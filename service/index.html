<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이용약관 - SimMeta</title>
    <meta name="description" content="SimMeta 웹·앱 개발 제반 서비스 이용약관">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg-main: #060913;
            --bg-card: rgba(18, 24, 43, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.3);
            --primary: #6366f1;
            --primary-glow: #818cf8;
            --secondary: #06b6d4;
            --accent: #a855f7;
            --emerald: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --font-ko: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            --radius-md: 14px;
            --radius-lg: 22px;
            --radius-xl: 32px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-family: var(--font-ko);
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }

        body {
            position: relative;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f1d 45%, #05070e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(6, 182, 212, 0.05) 50%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(6, 9, 19, 0.85);
            backdrop-filter: blur(16px);
            z-index: 1000;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            color: #fff;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(-3px);
        }

        /* Document Container */
        .doc-main {
            flex: 1;
            padding: 120px 24px 80px;
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
        }

        .doc-card {
            background: rgba(18, 24, 43, 0.88);
            border: 1px solid var(--border-subtle);
            backdrop-filter: blur(24px);
            border-radius: var(--radius-xl);
            padding: 56px 48px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(99, 102, 241, 0.12);
            animation: fadeInDoc 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInDoc {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .doc-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            margin-bottom: 36px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .doc-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 9999px;
            font-size: 0.82rem;
            color: var(--primary-glow);
            font-weight: 600;
        }

        .doc-badge-dot {
            width: 6px;
            height: 6px;
            background: var(--primary-glow);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-glow);
        }

        /* Markdown Typography */
        .markdown-body {
            color: #cbd5e1;
            line-height: 1.85;
            font-size: 1rem;
            word-break: keep-all;
        }

        .markdown-body h1 {
            font-size: 2.1rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: -0.02em;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5 {
            color: #f1f5f9;
            margin-top: 36px;
            margin-bottom: 14px;
            font-weight: 700;
        }

        .markdown-body h4,
        .markdown-body h5 {
            color: #818cf8;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .markdown-body h4::before,
        .markdown-body h5::before {
            content: "§";
            color: var(--secondary);
            font-weight: 400;
            font-size: 1rem;
        }

        .markdown-body p {
            margin-bottom: 16px;
            color: #94a3b8;
        }

        .markdown-body ul,
        .markdown-body ol {
            padding-left: 24px;
            margin-bottom: 20px;
            color: #cbd5e1;
        }

        .markdown-body li {
            margin-bottom: 8px;
        }

        .markdown-body strong {
            color: #ffffff;
        }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border-subtle);
            padding: 30px 0;
            background: rgba(6, 9, 19, 0.95);
            font-size: 0.88rem;
            color: var(--text-dim);
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .footer-links a {
            color: var(--text-dim);
            text-decoration: none;
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .doc-card {
                padding: 32px 20px;
            }
            .markdown-body h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="/" class="logo">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <span>SIMMETA<span style="color: var(--primary-glow);">.APP</span></span>
            </a>

            <div>
                <a href="/" class="btn btn-outline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    홈으로 돌아가기
                </a>
            </div>
        </div>
    </header>

    <!-- Main Document Section -->
    <main class="doc-main">
        <article class="doc-card">
            <div class="doc-top-bar">
                <div class="doc-badge">
                    <span class="doc-badge-dot"></span>
                    SimMeta 서비스 이용약관 (service.md)
                </div>
                <a href="/" class="btn btn-outline" style="padding: 6px 14px; font-size: 0.82rem;">
                    홈으로
                </a>
            </div>

            <!-- Markdown Render Target -->
            <div id="markdownTarget" class="markdown-body">
                <div style="text-align: center; padding: 40px 0; color: var(--text-muted);">
                    약관을 불러오는 중입니다...
                </div>
            </div>
        </article>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div>© 2026 SIMMETA APP STUDIO. All Rights Reserved.</div>
            <div class="footer-links">
                <a href="/service" style="color: var(--primary-glow); font-weight: 600;">이용약관</a>
                <a href="/privacy">개인정보처리방침</a>
            </div>
        </div>
    </footer>

    <!-- Markdown Loader Script -->
    <script>
        function cleanMarkdown(text) {
            return text
                .replace(/&#x20;/g, ' ')
                .replace(/\\\*/g, '·')
                .replace(/\r\n/g, '\n');
        }

        function fallbackParse(mdText) {
            const clean = cleanMarkdown(mdText);
            const lines = clean.split('\n');
            let html = '';
            let inList = false;

            for (let rawLine of lines) {
                let line = rawLine.trim();
                if (!line) {
                    if (inList) { html += '</ul>'; inList = false; }
                    continue;
                }
                if (line.startsWith('# ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h1>${line.substring(2)}</h1>`;
                } else if (line.startsWith('##### ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h5>${line.substring(6)}</h5>`;
                } else if (line.startsWith('#### ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h4>${line.substring(5)}</h4>`;
                } else if (line.startsWith('### ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h3>${line.substring(4)}</h3>`;
                } else if (line.startsWith('## ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h2>${line.substring(3)}</h2>`;
                } else if (line.startsWith('- ') || line.startsWith('* ')) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    html += `<li>${line.substring(2)}</li>`;
                } else if (/^\d+\.\s*/.test(line)) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<p style="padding-left: 12px;"><strong>${line.match(/^\d+\./)[0]}</strong> ${line.replace(/^\d+\.\s*/, '')}</p>`;
                } else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<p>${line}</p>`;
                }
            }
            if (inList) html += '</ul>';
            return html;
        }

        async function loadServiceMarkdown() {
            const target = document.getElementById('markdownTarget');
            try {
                // 1. service.md fetch 시도
                const response = await fetch('service.md');
                if (!response.ok) throw new Error('File fetch failed');
                const text = await response.text();

                if (window.marked && typeof window.marked.parse === 'function') {
                    target.innerHTML = window.marked.parse(cleanMarkdown(text));
                } else {
                    target.innerHTML = fallbackParse(text);
                }
            } catch (err) {
                console.warn('Direct fetch failed, trying fallback...', err);
                // 2. 상위 경로 또는 내장 텍스트 fallback
                try {
                    const fallbackRes = await fetch('../service.md');
                    if (fallbackRes.ok) {
                        const fallbackText = await fallbackRes.text();
                        target.innerHTML = fallbackParse(fallbackText);
                        return;
                    }
                } catch(e) {}

                // 최종 내장 fallback
                const embeddedServiceMd = `# 이용약관

##### 제1조(목적)
본 약관은 SimMeta(이하 '회사'라 함)가 운영하는 인터넷 사이버 몰에서 제공하는 웹·앱 개발 등 제반 서비스(이하 '서비스'라 함)를 이용함에 있어 회사와 이용자의 권리·의무 및 책임사항을 규정함을 목적으로 합니다.

#### 제2조(정의)
1. "사이버몰"이란 회사가 재화 또는 용역을 이용자에게 제공하기 위하여 컴퓨터 등 정보통신설비를 이용하여 재화 또는 용역을 거래할 수 있도록 설정한 가상의 영업장을 말합니다.
2. "이용자"란 "사이버몰"에 접속하여 본 약관에 따라 회사가 제공하는 서비스를 받는 회원 및 비회원을 말합니다.

#### 제3조(약관 등의 명시와 설명 및 개정)
1. 회사는 상호, 대표자 성명, 영업소 소재지 주소, 전화번호, 전자우편주소, 사업자 등록번호 등을 이용자가 쉽게 알 수 있도록 사이버몰 초기 화면에 게시합니다.
2. 회사는 전자상거래 등에서의 소비자보호에 관한 법률, 약관의 규제에 관한 법률 등 관련 법령을 위배하지 않는 범위에서 본 약관을 개정할 수 있습니다.

#### 제4조(서비스의 제공 및 변경)
1. 회사는 다음과 같은 업무를 수행합니다.
- 웹·앱 개발 서비스 제공
- 구매계약이 체결된 재화 및 서비스의 배송 및 전달
- 기타 회사가 정하는 업무

#### 제5조(주문 및 서비스 신청)
이용자는 전화, 온라인 접수(이메일 등)를 통해 다음 또는 이와 유사한 방법으로 구매를 신청합니다.
1. 재화 또는 용역의 사양 및 규격 선택
2. 주문자 성명, 주소, 전화번호, 이메일 등의 입력
3. 결제방법의 선택 및 결제

#### 제6조(대금지급방법)
회사에서 구매한 재화 또는 용역에 대한 대금지급방법은 다음 각 호의 방법 중 가능한 방법으로 할 수 있습니다.
1. 폰뱅킹, 인터넷뱅킹 등의 각종 계좌이체
2. 신용카드 등의 각종 카드 결제
3. 직접 결제(현금, 카드 등)

#### 제7조(주문제작 상품의 청약철회 및 제한)
1. 본 사이버몰에서 제공하는 웹·앱 개발 등의 용역은 소비자의 주문에 따라 개별적으로 생산되는 맞춤형 재화(주문제작)에 해당되므로, 작업이 개시된 이후에는 단순 변심에 의한 청약철회(취소) 및 환불이 제한될 수 있습니다.
2. 제작물의 불량, 오류 등 회사의 귀책사유로 인한 경우에는 재작업 또는 환불을 진행합니다.

#### 제8조(분쟁해결 및 관할법원)
1. 회사는 이용자가 제기하는 정당한 의견이나 불만을 반영하고 그 피해를 보상처리하기 위하여 노력합니다.
2. 본 서비스 이용과 관련하여 발생한 분쟁에 대해서는 회사의 본점 소재지를 관할하는 법원을 전속관할로 합니다.

#### 부칙
본 약관은 사이트 개설일로부터 적용됩니다.`;

                target.innerHTML = fallbackParse(embeddedServiceMd);
            }
        }

        document.addEventListener('DOMContentLoaded', loadServiceMarkdown);
    </script>
</body>
