    <!-- Markdown Loader Script -->
    <script>
        function cleanMarkdown(text) {
            return text
                .replace(/&#x20;/g, ' ')
                .replace(/\\\*/g, '·')
                .replace(/\\\[/g, '[')
                .replace(/\\\]/g, ']')
                .replace(/\r\n/g, '\n');
        }

        function fallbackParse(mdText) {
            const clean = cleanMarkdown(mdText);
            const lines = clean.split('\n');
            let html = '';
            let inList = false;

            for (let rawLine of lines) {
                let line = rawLine.trim();
                if (!line) {
                    if (inList) { html += '</ul>'; inList = false; }
                    continue;
                }
                if (line.startsWith('# ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h1>${line.substring(2)}</h1>`;
                } else if (line.startsWith('##### ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h5>${line.substring(6)}</h5>`;
                } else if (line.startsWith('#### ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h4>${line.substring(5)}</h4>`;
                } else if (line.startsWith('### ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h3>${line.substring(4)}</h3>`;
                } else if (line.startsWith('## ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<h2>${line.substring(3)}</h2>`;
                } else if (line.startsWith('- ') || line.startsWith('* ')) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    html += `<li>${line.substring(2)}</li>`;
                } else if (/^\d+\.\s*/.test(line)) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<p style="padding-left: 12px;"><strong>${line.match(/^\d+\./)[0]}</strong> ${line.replace(/^\d+\.\s*/, '')}</p>`;
                } else {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<p>${line}</p>`;
                }
            }
            if (inList) html += '</ul>';
            return html;
        }

        async function loadPrivacyMarkdown() {
            const target = document.getElementById('markdownTarget');
            try {
                // 1. privacy.md fetch 시도
                const response = await fetch('privacy.md');
                if (!response.ok) throw new Error('File fetch failed');
                const text = await response.text();

                if (window.marked && typeof window.marked.parse === 'function') {
                    target.innerHTML = window.marked.parse(cleanMarkdown(text));
                } else {
                    target.innerHTML = fallbackParse(text);
                }
            } catch (err) {
                console.warn('Direct fetch failed, trying fallback...', err);
                try {
                    const fallbackRes = await fetch('../privacy.md');
                    if (fallbackRes.ok) {
                        const fallbackText = await fallbackRes.text();
                        target.innerHTML = fallbackParse(fallbackText);
                        return;
                    }
                } catch(e) {}

                // 최종 내장 fallback
                const embeddedPrivacyMd = `# 개인정보처리방침

#### 제3조(본 방침의 공개)
1. 회사는 이용자가 언제든지 쉽게 본 방침을 확인할 수 있도록 회사 홈페이지 첫 화면 또는 첫 화면과의 연결화면을 통해 본 방침을 공개하고 있습니다.
2. 회사는 제1항에 따라 본 방침을 공개하는 경우 글자 크기, 색상 등을 활용하여 이용자가 본 방침을 쉽게 확인할 수 있도록 합니다.

2. 회사는 귀중한 회원의 개인정보를 안전하게 처리하며, 기록을 재생할 수 없도록 하는 기술적 방법을 사용하여 삭제합니다.

#### 제6조(이용자의 권리와 의무)
1. 이용자의 개인정보를 최신의 상태로 정확하게 입력하여 불의의 사고를 예방해 주시기 바랍니다. 이용자가 입력한 부정확한 정보로 인해 발생하는 사고의 책임은 이용자 자신에게 있으며 타인 정보의 도용 등 허위정보를 입력할 경우 회원 자격이 상실될 수 있습니다.
2. 이용자는 개인정보를 보호받을 권리와 함께 스스로를 보호하고 타인의 정보를 침해하지 않을 의무도 가지고 있습니다. 만약 이 같은 책임을 다하지 못하고 타인의 정보 및 존엄성을 훼손할 시에는 [정보통신망 이용촉진 및 정보보호 등에 관한 법률] 등에 의해 처벌받을 수 있습니다.

#### 제7조(개인정보 보호 책임자에 관한 사항)

                target.innerHTML = fallbackParse(embeddedPrivacyMd);
