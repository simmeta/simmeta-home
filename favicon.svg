<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Top Plate Gradient (Indigo -> Cyan) -->
    <linearGradient id="topPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Mid Plate Gradient (Cyan -> Indigo) -->
    <linearGradient id="midPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Bottom Plate Gradient (Indigo -> Purple) -->
    <linearGradient id="botPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Ambient Center Glow Filter -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Center Ambient Glow -->
  <circle cx="32" cy="31" r="15" fill="#6366f1" opacity="0.3" filter="url(#ambientGlow)" />

  <!-- 3D Layer Stack Symbol (SimMeta Identity) -->
  <g>
    <!-- Bottom Layer Polyline -->
    <path d="M14 41 L32 50 L50 41" fill="none" stroke="url(#botPlateGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Middle Layer Polyline -->
    <path d="M14 31 L32 40 L50 31" fill="none" stroke="url(#midPlateGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Top Layer Rhombus / Polygon -->
    <polygon points="32 12, 50 21, 32 30, 14 21" fill="url(#topPlateGrad)" fill-opacity="0.25" stroke="url(#topPlateGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Tech Core Accent Dot -->
    <circle cx="32" cy="21" r="2.5" fill="#ffffff" />
  </g>
</svg>

